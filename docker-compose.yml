services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  chroma_data:
    driver: local
